<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Huawei Network Monitor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <header>

        <h1>Huawei Network Monitoring Dashboard</h1>

        <div class="refresh">
            Refresh: <span id="lastUpdate">--</span>
        </div>

    </header>

    <!-- Summary Cards -->

    <div class="cards">

        <div class="card blue">
            <h3>Total Ports</h3>
            <h2 id="totalPorts">0</h2>
        </div>

        <div class="card green">
            <h3>Ports UP</h3>
            <h2 id="portsUp">0</h2>
        </div>

        <div class="card red">
            <h3>Ports DOWN</h3>
            <h2 id="portsDown">0</h2>
        </div>

        <div class="card purple">
            <h3>Total RX</h3>
            <h2 id="totalRx">0 Mbps</h2>
        </div>

        <div class="card orange">
            <h3>Total TX</h3>
            <h2 id="totalTx">0 Mbps</h2>
        </div>

    </div>

    <!-- Search -->

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search Interface...">

    </div>

    <!-- Interface Table -->

    <table id="portsTable">

        <thead>

        <tr>

            <th>Interface</th>

            <th>Status</th>

            <th>Speed</th>

            <th>RX Mbps</th>

            <th>TX Mbps</th>

            <th>RX Utilization</th>

            <th>TX Utilization</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>

</body>

</html>
